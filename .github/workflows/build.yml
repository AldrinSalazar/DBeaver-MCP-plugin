name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Maven
        run: mvn --version

      - name: Download DBeaver CE (test jars only)
        run: |
          curl -sSL -o /tmp/dbeaver-ce.tar.gz https://dbeaver.io/files/dbeaver-ce-latest-linux.gtk.x86_64.tar.gz
          mkdir -p /tmp/dbeaver-ce && tar xzf /tmp/dbeaver-ce.tar.gz -C /tmp/dbeaver-ce

      - name: Register DBeaver jars for tests
        run: ./scripts/install-dbeaver-libs.sh /tmp/dbeaver-ce/dbeaver

      - name: Build p2 repository ZIP
        run: mvn -B clean verify

      - name: Upload ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbeaver-mcp-zip
          path: repository/dev.astronauta.dbeaverMCP.repository/target/dbeaver-mcp-*.zip
